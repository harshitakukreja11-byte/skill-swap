<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><title>Profile</title><link rel="stylesheet" href="style.css"/></head>
<body>
  <main class="container">
    <h2>Your Profile</h2>
    <form id="profileForm" class="form-card">
      <label>Name</label><input id="name" />
      <label>Can teach (comma separated)</label><input id="canTeach" />
      <label>Want to learn (comma separated)</label><input id="wantLearn" />
      <label>Avatar URL (optional)</label><input id="avatar" />
      <button type="submit">Save</button>
    </form>
    <div id="msg"></div>
  </main>
  <script type="module" src="./profile.js"></script>
</body>
</html>
